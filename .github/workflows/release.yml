name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate server.json
        run: npm run validate:manifest

      - name: Build
        run: npm run build

      - name: Smoke test
        run: node dist/index.js --help

      # A release tag that disagrees with package.json publishes the wrong version silently.
      - name: Check tag matches package.json version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::release tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "version $PKG matches tag"

      - name: Publish to npm
        if: github.event_name == 'release' || inputs.dry_run == false
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --access public

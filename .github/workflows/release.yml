name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate server.json
        run: npm run validate:manifest

      - name: Build
        run: npm run build

      - name: Smoke test
        run: node dist/index.js --help

      # A release tag that disagrees with package.json publishes the wrong version silently.
      - name: Check tag matches package.json version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::release tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "version $PKG matches tag"

      - name: Publish to npm
        if: github.event_name == 'release' || inputs.dry_run == false
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --access public

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # Runs on dry runs too — it is the only meaningful pre-flight for the registry publish.
      - name: Validate server.json against the registry
        run: ./mcp-publisher validate

  # Separate job so MCP_REGISTRY_PRIVATE_KEY sits behind an environment restricted to v* tags.
  # That key controls the whole com.dialmcp namespace, not just this package, and a tag-only
  # policy would otherwise block workflow_dispatch dry runs from ever starting.
  registry:
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # The registry verifies ownership by fetching mcpName from the freshly published npm
      # version, so it 404s until npm propagates. Retry rather than fail the release.
      - name: Wait for npm to propagate
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for i in $(seq 1 10); do
            if curl -sfo /dev/null "https://registry.npmjs.org/dialmcp-connector/$VERSION"; then
              echo "npm has $VERSION"; exit 0
            fi
            echo "attempt $i: not visible yet, retrying in 15s"; sleep 15
          done
          echo "::error::dialmcp-connector@$VERSION never appeared on npm"; exit 1

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login dns --domain dialmcp.com --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          ./mcp-publisher publish
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
